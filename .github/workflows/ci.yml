name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Both actions are pinned to the commit of a release, so a moved tag cannot change them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install from the hash-pinned lockfile
        run: python -m pip install --require-hashes -r requirements.lock
      # The report is compiled with Typst 0.15.1 only. The archive's SHA-256 is the digest GitHub
      # lists for this asset on the v0.15.1 release, and the download fails unless it matches.
      - name: Install Typst 0.15.1
        env:
          TYPST_URL: https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/typst.tar.xz" "$TYPST_URL"
          echo "$TYPST_SHA256  $RUNNER_TEMP/typst.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/typst"
          tar --extract --xz --file "$RUNNER_TEMP/typst.tar.xz" --directory "$RUNNER_TEMP/typst" --strip-components=1
          echo "TYPST=$RUNNER_TEMP/typst/typst" >> "$GITHUB_ENV"
      - name: Full check
        run: python scripts/check.py
      - name: Dependency audit
        run: python -m pip_audit -r requirements.lock --disable-pip --require-hashes
