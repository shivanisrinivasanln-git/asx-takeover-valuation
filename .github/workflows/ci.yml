name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Every action is pinned to the commit of a release, so a moved tag cannot change it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install from the hash-pinned lockfile
        run: python -m pip install --require-hashes -r requirements.lock
      # The report is compiled with Typst 0.15.1 only. The archive's SHA-256 is the digest GitHub
      # lists for this asset on the v0.15.1 release, and the download fails unless it matches.
      - name: Install Typst 0.15.1
        env:
          TYPST_URL: https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/typst.tar.xz" "$TYPST_URL"
          echo "$TYPST_SHA256  $RUNNER_TEMP/typst.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/typst"
          tar --extract --xz --file "$RUNNER_TEMP/typst.tar.xz" --directory "$RUNNER_TEMP/typst" --strip-components=1
          echo "TYPST=$RUNNER_TEMP/typst/typst" >> "$GITHUB_ENV"
      - name: Full check
        run: python scripts/check.py
      - name: Dependency audit
        run: python -m pip_audit -r requirements.lock --disable-pip --require-hashes
      # Lighthouse runs on Node 24.21.0. The SHA-256 is the one nodejs.org lists in
      # SHASUMS256.txt for this archive.
      - name: Install Node 24.21.0
        env:
          NODE_URL: https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz
          NODE_SHA256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/node.tar.xz" "$NODE_URL"
          echo "$NODE_SHA256  $RUNNER_TEMP/node.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/node"
          tar --extract --xz --file "$RUNNER_TEMP/node.tar.xz" --directory "$RUNNER_TEMP/node" --strip-components=1
          echo "NODE=$RUNNER_TEMP/node/bin/node" >> "$GITHUB_ENV"
      - name: Install Lighthouse from its lockfile
        working-directory: scripts/lighthouse
        run: PATH="$RUNNER_TEMP/node/bin:$PATH" npm ci --ignore-scripts
      - name: Lighthouse budgets on every page
        env:
          PYTHONPATH: src
          CHROME_PATH: /usr/bin/google-chrome
          LIGHTHOUSE_CHROME_FLAGS: --headless=new --no-sandbox
        run: python scripts/lighthouse.py
      - name: Upload the site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  # Runs only after every check above has passed, and only for a push to main.
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
